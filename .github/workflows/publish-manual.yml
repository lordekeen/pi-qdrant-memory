# One-off / emergency publish of the current main state, gated on the full
# verification suite. Normally publishing happens automatically via
# release-please.yml when a GitHub release is created. Requires NPM_TOKEN.
#
# Security: actions pinned to full commit SHAs, least-privilege job
# permissions, credential-less checkout, publish serialized via concurrency.
name: manual-publish

on:
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
